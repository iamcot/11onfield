spring:
  application:
    name: backoffice

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/elevenof_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
      connection-test-query: SELECT 1
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: ElevenOfHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        query:
          plan_cache_max_size: 2048

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 15
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  # OAuth2 Resource Server configuration removed - using custom JWT implementation
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
  #         jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@11of.com}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: false
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 1d # Admin session timeout: 1 day

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs512-algorithm-security}
  expiration: 86400 # 24 hours in seconds

aws:
  s3:
    accessKey: ${AWS_ACCESS_KEY_ID:your-access-key}
    secretKey: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
    region: ${AWS_REGION:ap-southeast-1}
    bucketName: ${AWS_S3_BUCKET:11of}
    avatarFolder: avatars/
    eventImageFolder: events/
  lambda:
    accessKey: ${AWS_ACCESS_KEY_ID:your-access-key}
    secretKey: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
    region: ${AWS_REGION:ap-southeast-1}
    bgRemoverFunctionName: ${LAMBDA_BG_REMOVER_FUNCTION:bg-remover}

zalo:
  zns:
    appId: ${ZALO_APP_ID:your-app-id}
    appSecret: ${ZALO_APP_SECRET:your-app-secret}
    redirectUri: ${ZALO_REDIRECT_URI:http://localhost:8081/admin/zns/callback}
    codeChallenge: ${ZALO_CODE_CHALLENGE:vwIliF0AjbWFu4lV4g0fciDAI8OUie7tx2nM06_jdd8}
    codeVerifier: ${ZALO_CODE_VERIFIER:anylearn}
    otpTemplateId: ${ZALO_OTP_TEMPLATE_ID:275670}
    testMode: ${ZALO_TEST_MODE:true}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost}

logging:
  level:
    root: INFO
    com.elevenof.backoffice: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.devtools: WARN
    org.springframework.security: DEBUG
    com.elevenof.backoffice.service.ZnsService: DEBUG
    # Suppress SSE disconnection errors (Broken pipe, Connection reset)
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost]]": ERROR
    "[org.apache.coyote.http11.Http11Processor]": ERROR
    # Suppress SSE exception handler warnings (HttpMessageNotWritableException with text/event-stream)
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": ERROR
