<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (${title}, ~{::content}, ~{})}">
<head><title>Tài khoản</title></head>
<body>
<div th:fragment="content">
  <div class="row mb-3">
    <div class="col-12">
      <a href="/admin/users" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>
  </div>

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
  </div>

  <div class="row">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title" th:text="${editUser == null ? 'Tạo tài khoản mới' : 'Chỉnh sửa tài khoản'}">Tài khoản</h3>
        </div>
        <div class="card-body">
          <form th:action="${editUser == null ? '/admin/users/new' : '/admin/users/' + editUser.id + '/edit'}"
                method="post">

            <!-- Read-only info for existing users -->
            <div th:if="${editUser != null}" class="form-group row">
              <label class="col-sm-3 col-form-label">Số điện thoại</label>
              <div class="col-sm-9">
                <input type="text" class="form-control-plaintext" readonly th:value="${editUser.phone}" />
              </div>
            </div>
            <div th:if="${editUser != null}" class="form-group row">
              <label class="col-sm-3 col-form-label">UserID</label>
              <div class="col-sm-9">
                <input type="text" class="form-control-plaintext" readonly th:value="${editUser.userid}" />
              </div>
            </div>

            <!-- Phone (new user only) -->
            <div th:if="${editUser == null}" class="form-group row">
              <label class="col-sm-3 col-form-label">Số điện thoại <span class="text-danger">*</span></label>
              <div class="col-sm-9">
                <input type="text" class="form-control" name="phone" required maxlength="20"
                       placeholder="Nhập số điện thoại hoặc username" />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-sm-3 col-form-label">Họ và tên</label>
              <div class="col-sm-9">
                <input type="text" class="form-control" name="fullName" maxlength="100"
                       th:value="${editUser != null ? editUser.fullName : ''}" />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-sm-3 col-form-label">Email</label>
              <div class="col-sm-9">
                <input type="email" class="form-control" name="email" maxlength="100"
                       th:value="${editUser != null ? editUser.email : ''}" />
              </div>
            </div>

            <!-- Password (new user only) -->
            <div th:if="${editUser == null}" class="form-group row">
              <label class="col-sm-3 col-form-label">Mật khẩu <span class="text-danger">*</span></label>
              <div class="col-sm-9">
                <input type="password" class="form-control" name="password" required
                       placeholder="Mật khẩu ban đầu" />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-sm-3 col-form-label">Vai trò <span class="text-danger">*</span></label>
              <div class="col-sm-9">
                <select class="form-control" name="role" required>
                  <option th:each="r : ${allRoles}"
                          th:value="${r.name()}"
                          th:text="${r.name()}"
                          th:selected="${editUser != null and editUser.role == r}">
                  </option>
                </select>
              </div>
            </div>

            <div th:if="${editUser != null}" class="form-group row">
              <label class="col-sm-3 col-form-label">Trạng thái</label>
              <div class="col-sm-9 pt-2">
                <div class="custom-control custom-checkbox">
                  <input type="checkbox" class="custom-control-input" id="enabledCheck"
                         name="enabled" th:checked="${editUser.enabled}" />
                  <label class="custom-control-label" for="enabledCheck">Tài khoản đang hoạt động</label>
                </div>
              </div>
            </div>

            <div class="form-group row">
              <div class="col-sm-9 offset-sm-3">
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-save"></i>
                  <span th:text="${editUser == null ? 'Tạo tài khoản' : 'Lưu thay đổi'}">Lưu</span>
                </button>
                <a href="/admin/users" class="btn btn-secondary ml-2">Hủy</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
