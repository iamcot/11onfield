<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (${title}, ~{::content})}"
>
  <head>
    <title>Chỉnh sửa cầu thủ</title>
  </head>
  <body>
    <div th:fragment="content">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Chỉnh sửa thông tin cầu thủ</h3>
            </div>
            <form id="playerEditForm" th:action="@{/admin/players/edit/{id}(id=${player.id})}" method="post">
              <div class="card-body">
                <!-- User Information Section -->
                <h5 class="mb-3">Thông tin cơ bản</h5>
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="fullName">Họ và tên <span class="text-danger">*</span></label>
                      <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        name="fullName"
                        th:value="${user.fullName}"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="phone">Số điện thoại <span class="text-danger">*</span></label>
                      <input
                        type="text"
                        class="form-control"
                        id="phone"
                        name="phone"
                        th:value="${user.phone}"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="email">Email</label>
                      <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        th:value="${user.email}"
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="avatar">Avatar URL</label>
                      <input
                        type="text"
                        class="form-control"
                        id="avatar"
                        name="avatar"
                        th:value="${user.avatar}"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="dob">Ngày sinh</label>
                      <input
                        type="date"
                        class="form-control"
                        id="dob"
                        name="dob"
                        th:value="${user.dob}"
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="gender">Giới tính</label>
                      <select class="form-control" id="gender" name="gender">
                        <option value="">Chọn giới tính</option>
                        <option value="MALE" th:selected="${user.gender?.name() == 'MALE'}">Nam</option>
                        <option value="FEMALE" th:selected="${user.gender?.name() == 'FEMALE'}">Nữ</option>
                        <option value="OTHER" th:selected="${user.gender?.name() == 'OTHER'}">Khác</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="provinceId">Tỉnh/Thành phố</label>
                      <select class="form-control" id="provinceId" name="provinceId">
                        <option value="">Chọn tỉnh/thành phố</option>
                        <option
                          th:each="province : ${provinces}"
                          th:value="${province.id}"
                          th:text="${province.name}"
                          th:selected="${user.address != null && user.address.province.id == province.id}"
                        ></option>
                      </select>
                    </div>
                  </div>
                </div>

                <!-- Player Information Section -->
                <h5 class="mt-4 mb-3">Thông tin cầu thủ</h5>
                <div class="row">
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="height">Chiều cao (cm)</label>
                      <input
                        type="number"
                        class="form-control"
                        id="height"
                        name="height"
                        th:value="${player.height}"
                        min="100"
                        max="250"
                      />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="weight">Cân nặng (kg)</label>
                      <input
                        type="number"
                        class="form-control"
                        id="weight"
                        name="weight"
                        th:value="${player.weight}"
                        min="30"
                        max="150"
                      />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="preferredFoot">Chân thuận</label>
                      <select class="form-control" id="preferredFoot" name="preferredFoot">
                        <option value="">Chọn chân thuận</option>
                        <option value="left" th:selected="${player.preferredFoot == 'left'}">Trái</option>
                        <option value="right" th:selected="${player.preferredFoot == 'right'}">Phải</option>
                        <option value="both" th:selected="${player.preferredFoot == 'both'}">Cả hai</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="positions">Vị trí thi đấu</label>
                      <select
                        class="form-control"
                        id="positions"
                        name="positions"
                        multiple
                        size="5"
                        style="height: auto;"
                      >
                        <option value="striker" th:selected="${#strings.contains(player.positions, 'striker')}">Tiền đạo</option>
                        <option value="midfielder" th:selected="${#strings.contains(player.positions, 'midfielder')}">Tiền vệ</option>
                        <option value="defender" th:selected="${#strings.contains(player.positions, 'defender')}">Hậu vệ</option>
                        <option value="goalkeeper" th:selected="${#strings.contains(player.positions, 'goalkeeper')}">Thủ môn</option>
                      </select>
                      <small class="form-text text-muted">Giữ Ctrl/Cmd để chọn nhiều vị trí</small>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="level">Trình độ</label>
                      <select class="form-control" id="level" name="level">
                        <option value="">Chọn trình độ</option>
                        <option value="CAU_THU_MOI" th:selected="${player.level?.name() == 'CAU_THU_MOI'}">Cầu thủ mới</option>
                        <option value="NGHIEP_DU" th:selected="${player.level?.name() == 'NGHIEP_DU'}">Nghiệp dư</option>
                        <option value="TUYEN_TRE" th:selected="${player.level?.name() == 'TUYEN_TRE'}">Tuyển trẻ</option>
                        <option value="CHUYEN_NGHIEP" th:selected="${player.level?.name() == 'CHUYEN_NGHIEP'}">Chuyên nghiệp</option>
                      </select>
                    </div>
                  </div>
                </div>

                <!-- New Extended Information -->
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="personalId">Số CCCD</label>
                      <input
                        type="text"
                        class="form-control"
                        id="personalId"
                        name="personalId"
                        th:value="${player.personalId}"
                        maxlength="20"
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="address">Địa chỉ thường trú</label>
                      <input
                        type="text"
                        class="form-control"
                        id="address"
                        name="address"
                        th:value="${player.address}"
                        maxlength="500"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="school">Trường đang học</label>
                      <input
                        type="text"
                        class="form-control"
                        id="school"
                        name="school"
                        th:value="${player.school}"
                        maxlength="200"
                      />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="academy">Học viện đang tập</label>
                      <input
                        type="text"
                        class="form-control"
                        id="academy"
                        name="academy"
                        th:value="${player.academy}"
                        maxlength="200"
                      />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-group">
                      <label for="club">Đội bóng đang thi đấu</label>
                      <input
                        type="text"
                        class="form-control"
                        id="club"
                        name="club"
                        th:value="${player.club}"
                        maxlength="200"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <label for="bio">Tiểu sử</label>
                      <textarea
                        class="form-control"
                        id="bio"
                        name="bio"
                        rows="4"
                        th:text="${player.bio}"
                      ></textarea>
                    </div>
                  </div>
                </div>

                <!-- Achievements Section -->
                <h5 class="mt-4 mb-3">Thành tích</h5>
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Thành tích cá nhân</label>
                      <div id="individualAchievements">
                        <div th:each="achievement, iterStat : ${player.achievements}"
                             th:if="${achievement.type.name() == 'INDIVIDUAL'}"
                             class="mb-2">
                          <div class="row">
                            <div class="col-md-8 col-12 mb-2 mb-md-0">
                              <input
                                type="text"
                                class="form-control"
                                th:name="|individualAchievements[${iterStat.index}].title|"
                                th:value="${achievement.title}"
                                placeholder="Tiêu đề thành tích"
                                required
                              />
                            </div>
                            <div class="col-md-3 col-10 mb-2 mb-md-0">
                              <input
                                type="date"
                                class="form-control"
                                th:name="|individualAchievements[${iterStat.index}].date|"
                                th:value="${achievement.achievementDate}"
                                required
                              />
                            </div>
                            <div class="col-md-1 col-2">
                              <button type="button" class="btn btn-danger btn-remove-achievement w-100">
                                <i class="fas fa-times"></i>
                              </button>
                            </div>
                          </div>
                          <input
                            type="hidden"
                            th:name="|individualAchievements[${iterStat.index}].id|"
                            th:value="${achievement.id}"
                          />
                        </div>
                      </div>
                      <button type="button" class="btn btn-sm btn-success mt-2" id="addIndividualBtn">
                        <i class="fas fa-plus"></i> Thêm thành tích cá nhân
                      </button>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Thành tích tập thể</label>
                      <div id="teamAchievements">
                        <div th:each="achievement, iterStat : ${player.achievements}"
                             th:if="${achievement.type.name() == 'TEAM'}"
                             class="mb-2">
                          <div class="row">
                            <div class="col-md-8 col-12 mb-2 mb-md-0">
                              <input
                                type="text"
                                class="form-control"
                                th:name="|teamAchievements[${iterStat.index}].title|"
                                th:value="${achievement.title}"
                                placeholder="Tiêu đề thành tích"
                                required
                              />
                            </div>
                            <div class="col-md-3 col-10 mb-2 mb-md-0">
                              <input
                                type="date"
                                class="form-control"
                                th:name="|teamAchievements[${iterStat.index}].date|"
                                th:value="${achievement.achievementDate}"
                                required
                              />
                            </div>
                            <div class="col-md-1 col-2">
                              <button type="button" class="btn btn-danger btn-remove-achievement w-100">
                                <i class="fas fa-times"></i>
                              </button>
                            </div>
                            <input
                              type="hidden"
                              th:name="|teamAchievements[${iterStat.index}].id|"
                              th:value="${achievement.id}"
                            />
                          </div>
                        </div>
                      </div>
                      <button type="button" class="btn btn-sm btn-success mt-2" id="addTeamBtn">
                        <i class="fas fa-plus"></i> Thêm thành tích tập thể
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Highlights Section -->
                <h5 class="mt-4 mb-3">Video Highlights</h5>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <label>Video highlights</label>
                      <div id="highlights">
                        <div th:each="highlight, iterStat : ${player.highlights}" class="mb-2">
                          <div class="row">
                            <div class="col-md-8 col-12 mb-2 mb-md-0">
                              <input
                                type="url"
                                class="form-control"
                                th:name="|highlights[${iterStat.index}].url|"
                                th:value="${highlight.url}"
                                placeholder="URL video (YouTube, Facebook, Vimeo...)"
                                required
                              />
                            </div>
                            <div class="col-md-3 col-10 mb-2 mb-md-0">
                              <input
                                type="date"
                                class="form-control"
                                th:name="|highlights[${iterStat.index}].date|"
                                th:value="${highlight.highlightDate}"
                                required
                              />
                            </div>
                            <div class="col-md-1 col-2">
                              <button type="button" class="btn btn-danger btn-remove-highlight w-100">
                                <i class="fas fa-times"></i>
                              </button>
                            </div>
                            <input
                              type="hidden"
                              th:name="|highlights[${iterStat.index}].id|"
                              th:value="${highlight.id}"
                            />
                          </div>
                        </div>
                      </div>
                      <button type="button" class="btn btn-sm btn-success mt-2" id="addHighlightBtn">
                        <i class="fas fa-plus"></i> Thêm video highlight
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Social Media Section -->
                <h5 class="mt-4 mb-3">Mạng xã hội</h5>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <label>Liên kết mạng xã hội</label>
                      <div id="socials">
                        <div th:each="social, iterStat : ${player.socials}" class="mb-2">
                          <div class="input-group">
                            <input
                              type="url"
                              class="form-control"
                              th:name="|socials[${iterStat.index}].url|"
                              th:value="${social.url}"
                              placeholder="URL profile (Facebook, Instagram, TikTok...)"
                            />
                            <input
                              type="hidden"
                              th:name="|socials[${iterStat.index}].id|"
                              th:value="${social.id}"
                            />
                            <div class="input-group-append">
                              <button type="button" class="btn btn-danger btn-remove-social">
                                <i class="fas fa-times"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                      <button type="button" class="btn btn-sm btn-success mt-2" id="addSocialBtn">
                        <i class="fas fa-plus"></i> Thêm mạng xã hội
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="card-footer">
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-save"></i> Lưu thay đổi
                </button>
                <a th:href="@{/admin/players}" class="btn btn-secondary">
                  <i class="fas fa-times"></i> Hủy
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>

      <script>
        console.log('Script tag loaded');

        window.addEventListener('load', function() {
          console.log('Window loaded, jQuery available:', typeof jQuery !== 'undefined');

          if (typeof jQuery === 'undefined') {
            console.error('jQuery is not loaded!');
            return;
          }

          var $ = jQuery;
          var individualAchievementIndex = $('#individualAchievements .mb-2').length;
          var teamAchievementIndex = $('#teamAchievements .mb-2').length;
          var highlightIndex = $('#highlights .mb-2').length;
          var socialIndex = $('#socials .mb-2').length;

          console.log('Initialized counters:', {
            individualAchievementIndex: individualAchievementIndex,
            teamAchievementIndex: teamAchievementIndex,
            highlightIndex: highlightIndex,
            socialIndex: socialIndex
          });

          $('#addIndividualBtn').on('click', function() {
            console.log('Adding individual achievement, index:', individualAchievementIndex);
            $('#individualAchievements').append(
              '<div class="mb-2">' +
                '<div class="row">' +
                  '<div class="col-md-8 col-12 mb-2 mb-md-0">' +
                    '<input type="text" class="form-control" name="individualAchievements[' + individualAchievementIndex + '].title" placeholder="Tiêu đề thành tích" required />' +
                  '</div>' +
                  '<div class="col-md-3 col-10 mb-2 mb-md-0">' +
                    '<input type="date" class="form-control" name="individualAchievements[' + individualAchievementIndex + '].date" required />' +
                  '</div>' +
                  '<div class="col-md-1 col-2">' +
                    '<button type="button" class="btn btn-danger btn-remove-achievement w-100"><i class="fas fa-times"></i></button>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
            individualAchievementIndex++;
          });

          $('#addTeamBtn').on('click', function() {
            console.log('Adding team achievement, index:', teamAchievementIndex);
            $('#teamAchievements').append(
              '<div class="mb-2">' +
                '<div class="row">' +
                  '<div class="col-md-8 col-12 mb-2 mb-md-0">' +
                    '<input type="text" class="form-control" name="teamAchievements[' + teamAchievementIndex + '].title" placeholder="Tiêu đề thành tích" required />' +
                  '</div>' +
                  '<div class="col-md-3 col-10 mb-2 mb-md-0">' +
                    '<input type="date" class="form-control" name="teamAchievements[' + teamAchievementIndex + '].date" required />' +
                  '</div>' +
                  '<div class="col-md-1 col-2">' +
                    '<button type="button" class="btn btn-danger btn-remove-achievement w-100"><i class="fas fa-times"></i></button>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
            teamAchievementIndex++;
          });

          $('#addHighlightBtn').on('click', function() {
            console.log('Adding highlight, index:', highlightIndex);
            $('#highlights').append(
              '<div class="mb-2">' +
                '<div class="row">' +
                  '<div class="col-md-8 col-12 mb-2 mb-md-0">' +
                    '<input type="url" class="form-control" name="highlights[' + highlightIndex + '].url" placeholder="URL video (YouTube, Facebook, Vimeo...)" required />' +
                  '</div>' +
                  '<div class="col-md-3 col-10 mb-2 mb-md-0">' +
                    '<input type="date" class="form-control" name="highlights[' + highlightIndex + '].date" required />' +
                  '</div>' +
                  '<div class="col-md-1 col-2">' +
                    '<button type="button" class="btn btn-danger btn-remove-highlight w-100"><i class="fas fa-times"></i></button>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
            highlightIndex++;
          });

          $('#addSocialBtn').on('click', function() {
            console.log('Adding social, index:', socialIndex);
            $('#socials').append(
              '<div class="mb-2">' +
                '<div class="input-group">' +
                  '<input type="url" class="form-control" name="socials[' + socialIndex + '].url" placeholder="URL profile (Facebook, Instagram, TikTok...)" />' +
                  '<div class="input-group-append">' +
                    '<button type="button" class="btn btn-danger btn-remove-social"><i class="fas fa-times"></i></button>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
            socialIndex++;
          });

          $(document).on('click', '.btn-remove-achievement, .btn-remove-highlight, .btn-remove-social', function() {
            $(this).closest('.mb-2').remove();
          });

          // Validate form before submit
          $('#playerEditForm').on('submit', function(e) {
            var isValid = true;
            var errorMessage = '';

            // Check all achievement rows
            $('#individualAchievements .mb-2, #teamAchievements .mb-2').each(function() {
              var titleInput = $(this).find('input[type="text"]');
              var dateInput = $(this).find('input[type="date"]');

              if (titleInput.val().trim() !== '' && dateInput.val() === '') {
                isValid = false;
                errorMessage = 'Vui lòng chọn ngày cho tất cả các thành tích đã nhập';
                return false; // break loop
              }
            });

            // Check all highlight rows
            if (isValid) {
              $('#highlights .mb-2').each(function() {
                var urlInput = $(this).find('input[type="url"]');
                var dateInput = $(this).find('input[type="date"]');

                if (urlInput.val().trim() !== '' && dateInput.val() === '') {
                  isValid = false;
                  errorMessage = 'Vui lòng chọn ngày cho tất cả các video highlights đã nhập';
                  return false; // break loop
                }
              });
            }

            if (!isValid) {
              e.preventDefault();
              alert(errorMessage);
              return false;
            }
          });
        });
      </script>
    </div>
